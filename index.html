<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrheniux — Custom Apparel Manufacturer | Bhubaneswar</title>
    <meta name="description" content="Factory-direct custom t-shirts, hoodies, uniforms & merch. pan-India delivery." />
    <meta name="author" content="Arrheniux" />

    <meta property="og:title" content="Arrheniux — Custom Apparel Manufacturer" />
    <meta property="og:description" content="Factory-direct custom apparel. Min 20 pieces. Pan-India delivery." />
    <meta property="og:type" content="website" />

    <!-- Non-blocking font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap"
    />

    <!--
      LCP preload: stable public URL (must match Hero img src).
      Copy src/assets/hero-model.avif → public/hero-model.avif
      Do NOT preload /src/assets/*.jpg — that path is invalid in production and wastes bandwidth.
    -->
    <link
      rel="preload"
      as="image"
      href="/hero-model.avif"
      type="image/avif"
      fetchpriority="high"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
